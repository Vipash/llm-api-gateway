[project]
name = "llm-gateway"
version = "0.1.0"
description = "Multi-tenant LLM API gateway (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
